<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | Alejandro Sanchez Guinea{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | Alejandro Sanchez Guinea{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta property="og:image" content="{{ absURL "og.png" }}">
  <meta property="og:image:width" content="1731">
  <meta property="og:image:height" content="909">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | Alejandro Sanchez Guinea{{ end }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ absURL "og.png" }}">
  <link rel="canonical" href="{{ .Permalink }}">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body class="{{ if .IsHome }}home{{ else }}interior{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell nav-wrap">
      <a class="brand" href="/" aria-label="Alejandro Sanchez Guinea, home">
        <span class="brand-copy">
          <strong>Alejandro Sanchez Guinea</strong>
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        {{ range site.Menus.main }}<a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
        <a class="nav-cta js-contact-open" href="/contact/">Contact <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="main">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer site-footer-minimal">
    <div class="shell footer-bottom">
      <span>© Alejandro Sanchez Guinea {{ now.Year }}</span>
    </div>
  </footer>
  {{ partial "contact-modal.html" . }}
  <script src="/js/site.js?v=20260913-contact-list" defer></script>
</body>
</html>
